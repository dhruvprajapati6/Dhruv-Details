<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:linear-gradient(to right,#ff9a9e,#fad0c4);
color:#333;
transition:0.3s;
}

/* DARK MODE */
.dark{background:#111;color:white;}
.dark section{background:#222;}

/* CURSOR */
.cursor{
width:20px;height:20px;background:#ff4d6d;
position:fixed;border-radius:50%;
pointer-events:none;
box-shadow:0 0 20px #ff4d6d;
z-index:999;
}

/* HEADER */
header{text-align:center;padding:60px 20px;}

#typing{font-size:22px;margin-top:10px;color:#ff4d6d;font-weight:bold;}

/* PROFILE */
.profile{
width:150px;height:150px;object-fit:cover;
border-radius:50%;margin-top:20px;
border:4px solid white;
box-shadow:0 0 20px rgba(255,77,109,0.6);
transition:0.3s;
}
.profile:hover{transform:scale(1.1);}

/* GREEN DOT */
.profile-container{position:relative;display:inline-block;}
.online-dot{
position:absolute;bottom:15px;right:15px;
width:18px;height:18px;background:#00ff00;
border-radius:50%;border:3px solid white;
}

/* BUTTON */
.btn{
margin-top:15px;padding:10px 20px;border:none;
background:#ff4d6d;color:white;
border-radius:20px;cursor:pointer;
display:inline-block;text-decoration:none;
}

/* SECTION */
section{
padding:25px;margin:20px;background:white;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* PROJECT CARDS 🔥 */
.projects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
text-align:center;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}

.card p{
margin-top:8px;
font-weight:bold;
}

.card:hover{
transform:scale(1.05);
}

/* CONTACT */
.contact-box{
margin:10px 0;padding:12px;
background:#ffe5ec;border-radius:10px;
}

/* FOOTER */
footer{text-align:center;padding:20px;}
</style>
</head>

<!-- JS -->

<script>
let text="🚀 Python Developer | 🛡️ Cyber Security Learner";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,70);
}
}
type();
</script>

<script>
function toggleMode(){
document.body.classList.toggle("dark");
}
</script>

<script>
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
cursor.style.top=e.clientY+"px";
cursor.style.left=e.clientX+"px";
});
</script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
